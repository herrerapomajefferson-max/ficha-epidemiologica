    <script>
    const CREDENTIALS = { username: "minsa", password: "123" };

    function login() {
        const userIn = document.getElementById("username").value;
        const passIn = document.getElementById("password").value;
        const errorMsg = document.getElementById("login-error");
        if (userIn === CREDENTIALS.username && passIn === CREDENTIALS.password) {
            document.getElementById("login-container").style.display = "none";
            document.getElementById("form-container").style.display = "flex";
            document.querySelector(".submit-container").style.display = "block";
        } else {
            errorMsg.textContent = "Usuario o contraseña incorrectos.";
        }
    }

    document.addEventListener("DOMContentLoaded", function() {
        if (sessionStorage.getItem("autenticado") === "true") {
            document.getElementById("login-container").style.display = "none";
            document.getElementById("form-container").style.display = "flex";
            document.querySelector(".submit-container").style.display = "block";
        }
    });

    document.getElementById("password") && document.getElementById("password").addEventListener("keypress", function(e) {
        if (e.key === "Enter") login();
    });

    function descargarPDF() {
        const submitContainer = document.querySelector(".submit-container");
        if (submitContainer) submitContainer.style.display = "none";
        window.print();
        setTimeout(function() {
            if (submitContainer) submitContainer.style.display = "";
        }, 1000);
    }
    </script>

    <script src="app.js"></script>
