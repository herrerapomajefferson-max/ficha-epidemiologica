    @media print {

        #login-container, #edit-panel { display: none !important; }

            padding: 0 !important;
            background: none !important;
            min-height: unset !important;
        }
        .document-wrapper {
            box-shadow: none !important;
            max-width: 100% !important;
        }
        .submit-container { display: none !important; }

        /* Mostrar valores de inputs como texto visible */
        .abs-input, .abs-fecha-seg, .abs-digito {
            background-color: transparent !important;
            border: none !important;
            outline: none !important;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        /* Mostrar checkboxes y radios correctamente */
        .abs-check, .abs-radio {
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        body { margin: 0; padding: 0; }
        @page { margin: 0; size: A4 portrait; }
    }
    </style>

    <script>
    // ── 1. Color mostaza → transparente al escribir ──────────────────────────
    function initHasValue() {
        document.querySelectorAll('.abs-input, .abs-fecha-seg, .abs-digito').forEach(el => {
            // Estado inicial (por si ya tiene valor guardado)
            if (el.value && el.value.trim() !== '') el.classList.add('has-value');

            el.addEventListener('input', function() {
                if (this.value.trim() !== '') {
                    this.classList.add('has-value');
                } else {
                    this.classList.remove('has-value');
                }
            });
        });
    }

    // ── 2. Auto-avance Día → Mes → Año ───────────────────────────────────────
    function initFechasSeparadas() {
        let grupos = {};
        document.querySelectorAll('.abs-fecha-seg').forEach(el => {
            let g = el.dataset.grupo;
            if (!g) return;
            if (!grupos[g]) grupos[g] = [];
            grupos[g].push(el);
        });
        Object.values(grupos).forEach(campos => {
            campos.forEach((el, idx) => {
                el.addEventListener('input', function() {
                    if (this.value.length === this.maxLength && idx < campos.length - 1) {
                        campos[idx + 1].focus();
                    }
                });
                el.addEventListener('keypress', function(e) {
                    if (!/[0-9]/.test(e.key)) e.preventDefault();
                });
            });
        });
    }


    // ── Descargar PDF ─────────────────────────────────────────────────────────
    function descargarPDF() {
        // Ocultar panel de edición temporalmente
        const editPanel = document.getElementById('edit-panel');
        const submitContainer = document.querySelector('.submit-container');
        if (editPanel) editPanel.style.display = 'none';

        window.print();

        // Restaurar panel después de imprimir
        setTimeout(function() {
            if (editPanel) editPanel.style.display = '';
        }, 1000);
    }

    // Ejecutar cuando el formulario ya es visible
    document.addEventListener('DOMContentLoaded', function() {
        initFechasSeparadas();
        initHasValue();
    });

    // También re-ejecutar cuando el login muestra el formulario
    // (app.js llama showForm(), así que observamos el cambio de display)
    const _observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(m) {
            if (m.target.id === 'form-container' && m.attributeName === 'style') {
                initFechasSeparadas();
                initHasValue();
            }
        });
    });
    _observer.observe(document.getElementById('form-container'), { attributes: true });
    </script>
